<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jobapply-AI - run console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="masthead">
    <div class="brand">
      <h1>jobapply-AI</h1>
      <p class="tagline">Autonomous application loop. Runs on your machine, with your data.</p>
    </div>
    <div class="profile-pick">
      <label for="candidate">Candidate</label>
      <select id="candidate"></select>
      <span id="register-state" class="register-state"></span>
    </div>
  </header>

  <main>
    <section class="panel" id="status-panel">
      <h2>Loop status</h2>
      <div class="status-grid">
        <div class="seal" id="seal"><span id="seal-label">idle</span></div>
        <div class="status-readout" id="status-readout"></div>
      </div>
      <div class="controls">
        <button id="btn-start" class="primary">Start batch</button>
        <button id="btn-pause" class="ghost">Pause</button>
        <button id="btn-resume" class="ghost">Resume</button>
        <button id="btn-refresh" class="ghost">Refresh</button>
      </div>
      <p class="panel-note" id="control-note"></p>
    </section>

    <section class="panel" id="progress-panel">
      <h2>Today</h2>
      <div class="progress-meter">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label">0 / 0</div>
      </div>
      <div class="counts" id="counts"></div>
    </section>

    <section class="panel feed-panel" id="feed-panel">
      <h2>Live activity</h2>
      <p class="panel-note">Every source, filter, route, integrity check, and submission as it happens.</p>
      <ul class="feed" id="feed"></ul>
    </section>

    <section class="panel" id="tracker-panel">
      <h2>Application tracker</h2>
      <table class="tracker">
        <thead>
          <tr><th>Company</th><th>Title</th><th>Lane</th><th>Status</th><th>When</th></tr>
        </thead>
        <tbody id="tracker-body"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
